<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background-color: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #243b64;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }

        .form-row label {
            width: 220px;
            font-weight: bold;
            color: #333;
        }

        .input-area {
            flex: 1;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 15px;
            background-color: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3867d6;
            box-shadow: 0 0 4px rgba(56, 103, 214, 0.3);
        }

        /* Dropdown fix */
        select {
            height: 42px;
            cursor: pointer;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #bbb;
            border-radius: 5px;
            background-color: #fafafa;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        .radio-group label,
        .checkbox-group label {
            width: auto;
            font-weight: normal;
            cursor: pointer;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 6px;
            cursor: pointer;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 11px 30px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        input[type="submit"] {
            background-color: #3867d6;
            color: white;
        }

        input[type="reset"] {
            background-color: #777;
            color: white;
        }

        input[type="submit"]:hover {
            background-color: #274b9f;
        }

        input[type="reset"]:hover {
            background-color: #555;
        }

        .required {
            color: red;
        }

        /* Mobile screen */
        @media (max-width: 650px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }

            .form-row {
                display: block;
            }

            .form-row label {
                display: block;
                width: 100%;
                margin-bottom: 7px;
            }

            .buttons {
                flex-direction: column;
            }

            input[type="submit"],
            input[type="reset"] {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Registration Form</h1>

    <p class="subtitle">
        Please fill in the details below to complete your registration.
    </p>

    <form>

        <!-- Full Name -->
        <div class="form-row">
            <label>
                Full Name <span class="required">*</span>
            </label>

            <div class="input-area">
                <input type="text"
                       name="fullname"
                       placeholder="Enter your full name"
                       required>
            </div>
        </div>


        <!-- Mobile Number -->
        <div class="form-row">
            <label>
                Mobile Number <span class="required">*</span>
            </label>

            <div class="input-area">
                <input type="tel"
                       name="mobile"
                       placeholder="Enter mobile number"
                       pattern="[0-9]{10}"
                       maxlength="10"
                       required>
            </div>
        </div>


        <!-- Email -->
        <div class="form-row">
            <label>
                Email ID <span class="required">*</span>
            </label>

            <div class="input-area">
                <input type="email"
                       name="email"
                       placeholder="example@gmail.com"
                       required>
            </div>
        </div>


        <!-- Age -->
        <div class="form-row">
            <label>
                Age <span class="required">*</span>
            </label>

            <div class="input-area">
                <input type="number"
                       name="age"
                       min="1"
                       max="100"
                       placeholder="Enter your age"
                       required>
            </div>
        </div>


        <!-- Gender -->
        <div class="form-row">
            <label>Gender</label>

            <div class="input-area radio-group">

                <label>
                    <input type="radio"
                           name="gender"
                           value="male">
                    Male
                </label>

                <label>
                    <input type="radio"
                           name="gender"
                           value="female">
                    Female
                </label>

                <label>
                    <input type="radio"
                           name="gender"
                           value="other">
                    Others
                </label>

            </div>
        </div>


        <!-- Date of Birth -->
        <div class="form-row">
            <label>Date of Birth</label>

            <div class="input-area">
                <input type="date"
                       name="dob">
            </div>
        </div>


        <!-- Address -->
        <div class="form-row">
            <label>Address</label>

            <div class="input-area">
                <textarea
                    name="address"
                    placeholder="Enter your complete address"></textarea>
            </div>
        </div>


        <!-- Current Study -->
        <div class="form-row">
            <label>
                Current Study <span class="required">*</span>
            </label>

            <div class="input-area">

                <select name="study" required>

                    <option value="">
                        -- Select Course --
                    </option>

                    <option value="BTech">
                        B.Tech
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                    <option value="BSc">
                        B.Sc
                    </option>

                    <option value="MCA">
                        MCA
                    </option>

                    <option value="MTech">
                        M.Tech
                    </option>

                </select>

            </div>
        </div>


        <!-- Department -->
        <div class="form-row">

            <label>
                Department <span class="required">*</span>
            </label>

            <div class="input-area">

                <select name="department" required>

                    <option value="">
                        -- Select Department --
                    </option>

                    <option value="CS">
                        Computer Science
                    </option>

                    <option value="IT">
                        Information Technology
                    </option>

                    <option value="EC">
                        Electronics & Communication
                    </option>

                    <option value="EE">
                        Electrical & Electronics
                    </option>

                    <option value="ME">
                        Mechanical Engineering
                    </option>

                </select>

            </div>

        </div>


        <!-- Upload CV -->
        <div class="form-row">

            <label>Upload CV</label>

            <div class="input-area">

                <input type="file"
                       name="cv"
                       accept=".pdf,.doc,.docx">

            </div>

        </div>


        <!-- Programming Languages -->
        <div class="form-row">

            <label>
                Programming Languages
            </label>

            <div class="input-area checkbox-group">

                <label>
                    <input type="checkbox"
                           name="programming"
                           value="HTML">
                    HTML
                </label>

                <label>
                    <input type="checkbox"
                           name="programming"
                           value="React">
                    React.js
                </label>

                <label>
                    <input type="checkbox"
                           name="programming"
                           value="CSS">
                    CSS
                </label>

                <label>
                    <input type="checkbox"
                           name="programming"
                           value="Flutter">
                    Flutter
                </label>

            </div>

        </div>


        <!-- Language -->
        <div class="form-row">

            <label>
                Language
            </label>

            <div class="input-area checkbox-group">

                <label>
                    <input type="checkbox"
                           name="language"
                           value="English">
                    English
                </label>

                <label>
                    <input type="checkbox"
                           name="language"
                           value="Malayalam">
                    Malayalam
                </label>

                <label>
                    <input type="checkbox"
                           name="language"
                           value="Arabic">
                    Arabic
                </label>

                <label>
                    <input type="checkbox"
                           name="language"
                           value="Hindi">
                    Hindi
                </label>

            </div>

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <input type="submit"
                   value="Submit">

            <input type="reset"
                   value="Reset">

        </div>

    </form>

</div>

</body>
</html>
