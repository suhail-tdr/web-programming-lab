<html>
<head>
    <title>JavaScript Event Handling</title>

    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            text-align: center;
        }

        button {
            background-color: lightblue;
            padding: 10px 20px;
            border: none;
            
        }

        #box {
            width: 90%;
            height: 200px;
            margin: auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="box">
        <h1>JAVASCRIPT EVENT HANDLING</h1>

        <p>Click on button to change the background color</p>

        <button onclick="changeColor()">Click here</button>

        <p id="msg"></p>
    </div>

</body>

<script>
    function changeColor() {
        document.getElementById("box").style.backgroundColor = "lightgray";

        document.getElementById("msg").innerHTML = "color changed";
    }
</script>

</html>
